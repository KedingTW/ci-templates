name: AI Code Review

on:
  pull_request_target:
    types: [labeled]
  workflow_call:
    secrets:
      token:
        required: true
      AWS_REGION:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_BEDROCK_ACCESS_ROLE_ARN:
        required: true
      AWS_BEDROCK_EXTERNAL_ID:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install boto3 PyGithub

      - name: Configure AWS Base Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Assume Role for Bedrock
        run: |
          CREDS=$(aws sts assume-role \
            --role-arn "${{ secrets.AWS_BEDROCK_ACCESS_ROLE_ARN }}" \
            --role-session-name "GitHubActions" \
            --external-id "${{ secrets.AWS_BEDROCK_EXTERNAL_ID }}" \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)
          ACCESS_KEY=$(echo $CREDS | cut -d' ' -f1)
          SECRET_KEY=$(echo $CREDS | cut -d' ' -f2)
          SESSION_TOKEN=$(echo $CREDS | cut -d' ' -f3)
          echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$SECRET_KEY" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$SESSION_TOKEN" >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV

      - name: Run AI Code Review
        run: python .github/scripts/ai_code_review.py
        env:
          GITHUB_TOKEN: ${{ secrets.token }}